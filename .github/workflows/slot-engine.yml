name: Slot engine

on:
  push:
    branches: [main]
    paths: ['services/slot-engine/**', '.github/workflows/slot-engine.yml']
  pull_request:
    paths: ['services/slot-engine/**', '.github/workflows/slot-engine.yml']

permissions:
  contents: read

concurrency:
  group: slot-engine-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: services/slot-engine

jobs:
  check:
    name: Vet, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/slot-engine/go.mod
          cache-dependency-path: services/slot-engine/go.sum
      - name: Format
        run: test -z "$(gofmt -l engine main.go config)"
      - run: go vet ./engine/ .
      - name: Test (every game spins; key; no network outside the server; RTP of the spin path)
        run: go test ./engine/ -count=1
      - run: CGO_ENABLED=0 go build -trimpath -o /tmp/slot-engine .
