# CI for the monorepo. Each app has its own jobs, triggered only when its files change,
# so the frontend and backend are validated (and later deployed) independently.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages: [check, test, build]

# ---------------------------------------------------------------- API (Laravel)

.api:
  image: php:8.5-cli-alpine
  rules:
    - changes:
        - apps/api/**/*
        - docker/**/*
        - .gitlab-ci.yml
  variables:
    COMPOSER_CACHE_DIR: $CI_PROJECT_DIR/.cache/composer
  cache:
    key:
      files: [apps/api/composer.lock]
    paths: [.cache/composer]
  before_script:
    - apk add --no-cache git unzip
    - curl -sSLf -o /usr/local/bin/install-php-extensions https://github.com/mlocati/docker-php-extension-installer/releases/latest/download/install-php-extensions
    - chmod +x /usr/local/bin/install-php-extensions
    - install-php-extensions pdo_mysql redis intl zip pcntl bcmath gd
    - curl -sSLf https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - cd apps/api
    - composer install --no-interaction --prefer-dist --no-progress

api:lint:
  extends: .api
  stage: check
  script:
    - composer lint
    - composer analyse

api:test:
  extends: .api
  stage: test
  services:
    - name: mysql:8.4
      alias: mysql
    - name: redis:7.4-alpine
      alias: redis
  variables:
    MYSQL_DATABASE: testing
    MYSQL_USER: game
    MYSQL_PASSWORD: secret
    MYSQL_ROOT_PASSWORD: root-secret
    DB_HOST: mysql
    DB_USERNAME: game
    DB_PASSWORD: secret
    REDIS_HOST: redis
  script:
    - cp .env.example .env
    - php artisan key:generate --no-interaction
    - php artisan test

api:image:
  stage: build
  image: docker:28
  services: [docker:28-dind]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/api/**/*
        - docker/**/*
  script:
    # Push to a registry once deployment is set up (Phase 8).
    - docker build --target prod -f docker/php/Dockerfile -t "$CI_PROJECT_PATH_SLUG/api:$CI_COMMIT_SHORT_SHA" .

# ---------------------------------------------------------------- Web (React)

.web:
  image: node:24-alpine
  rules:
    - changes:
        - apps/web/**/*
        - .gitlab-ci.yml
  cache:
    key:
      files: [apps/web/package-lock.json]
    paths: [.cache/npm]
  before_script:
    - cd apps/web
    - npm ci --cache "$CI_PROJECT_DIR/.cache/npm" --prefer-offline --no-audit --no-fund

web:lint:
  extends: .web
  stage: check
  script:
    - npm run typecheck
    - npm run lint
    - npm run format:check

web:test:
  extends: .web
  stage: test
  script:
    - npm test

web:build:
  extends: .web
  stage: build
  script:
    - npm run build
  artifacts:
    paths: [apps/web/dist]
    expire_in: 1 week
